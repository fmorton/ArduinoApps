name: joystick_brick_wautodetectv2
services:
  joystick:
    build:
      context: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2/.cache/compose/joystickbridge
      dockerfile: Dockerfile
    develop:
      watch:
        - path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2/.cache/compose/joystickbridge/app
          action: rebuild
        - path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2/.cache/compose/joystickbridge/brick_compose.yaml
          action: rebuild
        - path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2/.cache/compose/joystickbridge/Dockerfile
          action: rebuild
        - path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2/.cache/compose/joystickbridge/__init__.py
          action: restart
    devices:
      - source: /usr/sbin/rfkill
        target: /usr/sbin/rfkill
        permissions: rwm
    environment:
      APP_HOME: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2
      BOARD_NAME: unoq
      CONFIGURED_CARRIERS: media-carrier
      HOST_DSP_INSTALLATION_PATH: ""
      HOST_IP: 192.168.7.119
      MODELS_PATH: /var/lib/arduino-app-cli/models
      VIDEO_DEVICE: ""
      XDG_RUNTIME_DIR: /run/user/1000
    group_add:
      - "995"
      - "44"
      - "29"
      - "991"
      - "20"
      - "107"
      - "1001"
    labels:
      cc.arduino.app: "true"
      cc.arduino.app.path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5000
        published: "5000"
        protocol: tcp
    privileged: true
    user: 1000:1000
    volumes:
      - type: bind
        source: /var/run/dbus
        target: /var/run/dbus
        bind: {}
      - type: bind
        source: /dev/input
        target: /dev/input
        read_only: true
        bind: {}
  main:
    depends_on:
      joystick:
        condition: service_started
        required: true
    device_cgroup_rules:
      - c 226:* rmw
      - c 250:* rmw
      - c 504:* rmw
      - c 81:* rmw
      - c 116:* rmw
      - c 10:261 rmw
    entrypoint:
      - /run.sh
    environment:
      APP_HOME: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2
      BOARD_NAME: unoq
      CONFIGURED_CARRIERS: media-carrier
      HOST_DSP_INSTALLATION_PATH: ""
      HOST_IP: 192.168.7.119
      MODELS_PATH: /var/lib/arduino-app-cli/models
      VIDEO_DEVICE: ""
      XDG_RUNTIME_DIR: /run/user/1000
    extra_hosts:
      - msgpack-rpc-router=host-gateway
    group_add:
      - "44"
      - "29"
      - "991"
      - "20"
      - "107"
      - "1001"
    image: ghcr.io/arduino/app-bricks/python-apps-base:0.13.1
    labels:
      cc.arduino.app: "true"
      cc.arduino.app.main: "true"
      cc.arduino.app.path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    networks:
      default: null
    user: 1000:1000
    volumes:
      - type: bind
        source: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2
        target: /app
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/user/1000/pipewire-0
        target: /run/user/1000/pipewire-0
        bind:
          create_host_path: false
      - type: bind
        source: /sys/firmware/devicetree/base/model
        target: /sys/firmware/devicetree/base/model
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/arduino-router.sock
        target: /run/arduino-router.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/arduino-router.sock
        target: /var/run/arduino-router.sock
        bind:
          create_host_path: false
      - type: bind
        source: /run/arduino-cloud-connector
        target: /run/arduino-cloud-connector
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/arduino-cloud-connector
        target: /var/run/arduino-cloud-connector
        bind:
          create_host_path: false
networks:
  default:
    name: joystick_brick_wautodetectv2_default
    labels:
      cc.arduino.app: "true"
      cc.arduino.app.path: /home/arduino/ArduinoApps/joystick_brick_wautodetectv2
