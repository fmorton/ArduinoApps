services:
  xbox_controller_brick:
    build: 
      context: .        # Looks inside your bricks/xbox_controller_brick folder
      dockerfile: Dockerfile
    container_name: xbox_controller_brick
    privileged: true     # Mandatory for Linux gamepad USB driver hardware hooks
    devices:
      - "/dev/input:/dev/input"
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
