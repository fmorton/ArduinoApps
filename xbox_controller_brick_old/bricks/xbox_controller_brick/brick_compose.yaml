services:
  xbox_controller_brick:
    build:
      context: .
    container_name: xbox_controller_brick
    develop:
      watch:
        - action: rebuild
          path: ./bricks/xbox_controller_brick
    privileged: true
    group_add:
      - "995"
    devices:
      - "/dev/input:/dev/input"
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
